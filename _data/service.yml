# Research community service.
#
# `years` is a free-text string, so "2013, 2015" and "2014–2016" both work.
# Leave it empty and the entry renders without years — useful when the service
# is certain but the year isn't.
#
# Program committees are recorded through 2026. Journal reviewing stops at 2015;
# anything since then simply hasn't been supplied yet.

# Standing committees, rendered above the organizing roles.
steering:
  - role: Steering Committee
    venue: ACM/IFIP/USENIX International Middleware Conference
    years: "since 2018"
  - role: Chair, Invention Development Team
    venue: IBM
    years: "4 years"
    note: >-
      The IBM-wide committee that evaluated invention disclosures for strategic
      patent filing.

# Grouped by seniority of role, newest first within each group: general chair,
# then program chair, then industry program chair, then posters chair. "Track
# chair" is deliberately not used anywhere here — at these venues that title
# means session chair, which is a different job.
#
# `url`, `where` and `note` are all optional.
organizing:
  - role: General Chair
    venue: IEEE International Symposium on Modeling, Analysis and Simulation of Computer and Telecommunication Systems (MASCOTS)
    years: "2023"
    where: Stony Brook, NY
    url: https://ieeexplore.ieee.org/document/10387619
  - role: General Chair
    venue: ACM/IFIP/USENIX International Middleware Conference
    years: "2017"
    where: Las Vegas, NV
    url: https://middleware2017.github.io/middleware2017/
  - role: Program Co-Chair
    venue: IEEE International Conference on Autonomic Computing and Self-Organizing Systems (ACSOS)
    years: "2025"
    where: Tokyo, Japan
    url: https://2025.acsos.org/
  - role: Program Vice-Chair
    venue: IEEE International Conference on Distributed Computing Systems (ICDCS)
    years: "2024"
    where: Jersey City, NJ
    url: https://icdcs2024.icdcs.org/technical-committee/
  - role: Industry Program Co-Chair
    venue: IEEE International Conference on Autonomic Computing and Self-Organizing Systems (ACSOS)
    years: "2021"
    url: https://conf.researchr.org/track/acsos-2021/acsos-2021-in-practice-track
  - role: Industry Program Co-Chair
    venue: IEEE International Conference on Autonomic Computing and Self-Organizing Systems (ACSOS)
    years: "2020"
    url: https://2020.acsos.org/track/acsos-2020-in-practice-track
  - role: Industry Program Co-Chair
    venue: ACM/IFIP/USENIX International Middleware Conference
    years: "2015"
    where: Vancouver, BC
    url: https://dl.acm.org/doi/proceedings/10.1145/2830013
  - role: Research Posters Co-Chair
    venue: ACM SPLASH
    years: "2014"
    url: https://2014.splashcon.org/track/splash2014-posters
  - role: Research Posters Co-Chair
    venue: ACM SPLASH
    years: "2013"
    url: https://2013.splashcon.org/track/splash-2013-Posters

# Ordered by most recent year of service. `note` is optional — use it only where
