    url: https://research.ibm.com/people/jayaram-kr-kallapalayam-radhakrishnan
  - name: Google Scholar
    url: https://scholar.google.com/citations?user=okMlqaMAAAAJ&hl=en
  - name: DBLP
    url: https://dblp.org/pid/21/2983.html
  - name: LinkedIn
    url: https://www.linkedin.com/in/jayaramkr/

nav:
