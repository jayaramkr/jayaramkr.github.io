# Site-wide settings. Edit these and everything downstream follows.
# Three names, deliberately: the site header uses `title`, publication author
# lists bold `publishing_name`, and patents are filed under `legal_name`.
title: Jayaram K Radhakrishnan
publishing_name: K. R. Jayaram
legal_name: Jayaram Kallapalayam Radhakrishnan
tagline: Senior Technical Leader, IBM Research
description: >-
  Jayaram K Radhakrishnan is a senior technical leader at IBM working on agents
  and automation, with a focus on agentic memory. He publishes as K. R. Jayaram.
url: https://jayaramkr.github.io
baseurl: ""
lang: en

# Flip to false to remove the banner once the site is ready.
under_construction: true

# Footer / header links. Add or remove freely.
links:
